name: release-image
on:
  workflow_dispatch:
    inputs:
      image:
        description: directory under this repo to build (one image per directory)
        required: true
        default: tabbyapi-exl3
      tag:
        description: tag to publish alongside the digest
        required: true
        default: v1
      sbom:
        description: attach an SBOM; disable for images whose package tree exceeds the 40 MB attestation limit
        required: false
        default: "true"
      smoke:
        description: "smoke mode: skip build; anonymous full amd64 pull of `digest` + CPU import/parser checks"
        required: false
        default: "false"
      digest:
        description: "smoke mode: sha256 digest of the published image to pull and verify"
        required: false
        default: ""
      engine:
        description: "smoke mode: sglang | vllm | tabby | llama (selects CPU checks)"
        required: false
        default: ""
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    if: inputs.smoke != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify pins
        run: |
          set -euo pipefail
          dir="./${{ inputs.image }}"
          df="$dir/Dockerfile"
          test -f "$df" || { echo "::error::$df not found"; exit 1; }
          fail=0
          # Every FROM must reference an upstream image by @sha256: digest,
          # unless it names an earlier build stage. A tag is never enough:
          # recipes pin the digest this workflow prints, so the base it was
          # built on must be pinned too.
          stages=""
          while IFS= read -r ref alias; do
            case " $stages " in *" $ref "*) continue;; esac
            case "$ref" in
              scratch) ;;
              *@sha256:*) ;;
              *) echo "::error::unpinned FROM '$ref' in $df (pin by @sha256:)"; fail=1;;
            esac
            [ -n "$alias" ] && stages="$stages $alias"
          done < <(grep -iE '^[[:space:]]*FROM[[:space:]]' "$df" \
            | sed -E 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+(--platform=[^[:space:]]+[[:space:]]+)?([^[:space:]]+)([[:space:]]+[Aa][Ss][[:space:]]+([^[:space:]]+))?.*/\2 \4/')
          # Every remote ADD must carry a --checksum= so the fetched asset is
          # pinned to a content hash, not just a URL.
          while IFS= read -r line; do
            case "$line" in *http*://*)
              case "$line" in *--checksum=sha256:*) ;;
                *) echo "::error::remote ADD without --checksum=sha256: in $df: $line"; fail=1;; esac
            esac
          done < <(grep -iE '^[[:space:]]*ADD[[:space:]]' "$df" || true)
          # ExLlamaV3 counts KV in 256-token pages and refuses a window-filling
          # request when cache == window, so a baked TabbyAPI config MUST reserve
          # cache_size strictly greater than max_seq_len. An equal pair loads fine
          # and then fails on the one request that fills the window.
          cfg="$dir/config.yml"
          if [ -f "$cfg" ]; then
            ms=$(sed -nE 's/^[[:space:]]*max_seq_len:[[:space:]]*([0-9]+).*/\1/p' "$cfg" | head -1)
            cs=$(sed -nE 's/^[[:space:]]*cache_size:[[:space:]]*([0-9]+).*/\1/p' "$cfg" | head -1)
            if [ -n "$ms" ] && [ -n "$cs" ] && [ "$cs" -le "$ms" ]; then
              echo "::error::$cfg cache_size ($cs) must be > max_seq_len ($ms)"; fail=1
            fi
          fi
          exit $fail
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push with SLSA provenance
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ inputs.image }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/0xsero/${{ inputs.image }}:${{ inputs.tag }}
          provenance: mode=max
          sbom: ${{ inputs.sbom == 'true' }}
          # Shared-layer reuse across builds of the same base (apt layers,
          # base pulls) so repeated matrix builds do not rebuild every layer.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/0xsero/${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record provenance
        run: |
          set -euo pipefail
          out="ghcr.io/0xsero/${{ inputs.image }}@${{ steps.push.outputs.digest }}"
          echo "IMAGE=$out"
          {
            echo "## ${{ inputs.image }}:${{ inputs.tag }}"
            echo ""
            echo "- image: \`$out\`"
            echo "- base pins:"
            grep -iE '^[[:space:]]*FROM[[:space:]]' "./${{ inputs.image }}/Dockerfile" \
              | sed -E 's/^/  - `/; s/[[:space:]]*$/`/'
            echo "- verify: \`gh attestation verify oci://$out -o 0xSero\`"
          } >> "$GITHUB_STEP_SUMMARY"
  smoke:
    if: inputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          df -h /
      - name: Anonymous full amd64 pull + digest verify (fail-closed)
        run: |
          set -euo pipefail
          test -n "${{ inputs.digest }}" || { echo "::error::smoke needs a digest input"; exit 1; }
          ref="ghcr.io/0xsero/${{ inputs.image }}@${{ inputs.digest }}"
          docker logout ghcr.io || true   # force an anonymous pull of the public image
          docker pull --platform linux/amd64 "$ref"
          got=$(docker image inspect "$ref" --format '{{ index .RepoDigests 0 }}' | sed 's/.*@//')
          echo "requested=${{ inputs.digest }}"
          echo "resolved =$got"
          [ "$got" = "${{ inputs.digest }}" ] || { echo "::error::pulled digest != pinned digest"; exit 1; }
          {
            echo "## smoke ${{ inputs.image }}"
            echo "- anonymous full linux/amd64 pull: OK (all layers fetched + integrity-checked by docker)"
            echo "- digest verified: \`${{ inputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: CPU import + parser/flag checks (fail-closed)
        run: |
          set -euo pipefail
          ref="ghcr.io/0xsero/${{ inputs.image }}@${{ inputs.digest }}"
          e="${{ inputs.engine }}"
          pass(){ echo "- $1: PASS" >> "$GITHUB_STEP_SUMMARY"; }
          case "$e" in
            sglang)
              docker run --rm --entrypoint /opt/sglang/bin/python3 "$ref" -c "import sglang, huggingface_hub; print('sglang', getattr(sglang,'__version__','?'), 'hf_hub', huggingface_hub.__version__)"
              pass "sglang + huggingface_hub import"
              docker run --rm --entrypoint sh "$ref" -c 'command -v python3 >/dev/null'
              pass "python3 present"
              # Exercise the ACTUAL image ENTRYPOINT preflight end-to-end on CPU: it fetches the
              # pinned-revision model into /opt/models and writes .omp-ready, then the base shim
              # execs our passed command (which verifies the marker). No GPU, no server launch.
              docker run --rm "$ref" sh -c 'set -e; ls -la /opt/models/MiniCPM5-2B-GPTQ >/dev/null; test -s /opt/models/MiniCPM5-2B-GPTQ/config.json; test -f /opt/models/MiniCPM5-2B-GPTQ/.omp-ready; echo PREFLIGHT_MARKER_OK'
              pass "ENTRYPOINT preflight resolved pinned model to /opt/models/MiniCPM5-2B-GPTQ + wrote .omp-ready (CPU, 0 GPU)"
              # The baked CMD passes explicit --tool-call-parser minicpm5 --reasoning-parser qwen3.
              # sglang's --help does NOT enumerate plugin parsers, so grepping help is a false-negative.
              # Authoritative test: launch_server's argparse validates a choice when it consumes the
              # flag, and --help exits 0 only after all preceding flags parsed cleanly. So `<flags> --help`
              # exits 0 iff the choices are ACCEPTED, and errors "invalid choice" first if not. This tests
              # exactly what the baked CMD will do at serve time. No GPU, no model load (help short-circuits).
              if docker run --rm --entrypoint /opt/sglang/bin/python3 "$ref" -m sglang.launch_server --model-path /tmp/none --tool-call-parser minicpm5 --reasoning-parser qwen3 --help >/tmp/sgh 2>&1; then
                pass "launch_server ACCEPTS baked flags --tool-call-parser minicpm5 --reasoning-parser qwen3 (argparse valid)"
              else
                echo "::error::launch_server REJECTS the baked parser flags (baked CMD is non-runnable):"
                grep -iE 'invalid choice|error|usage' /tmp/sgh | head -5
                exit 1
              fi ;;
            vllm)
              docker run --rm --entrypoint python3 "$ref" -c "import huggingface_hub; print('hf_hub', huggingface_hub.__version__)"
              pass "huggingface_hub import"
              H=$(docker run --rm --entrypoint vllm "$ref" serve /tmp/none --help 2>&1 || true)
              for f in --model --served-model-name --max-model-len --gpu-memory-utilization --kv-cache-dtype --trust-remote-code; do
                echo "$H" | grep -q -- "$f" || { echo "::error::flag $f missing"; exit 1; }; done
              pass "vllm serve flags present"
              # Surface the ENUMERATED parser registries from --help (the registry itself, not an exit-code
              # inference): proves which parsers ARE/ARE NOT available and survives future error-text changes.
              {
                echo "### vLLM parser registries (from serve --help)"
                echo '```'
                echo "$H" | grep -iE -- '--tool-call-parser' -A3 | sed -n '1,4p'
                echo "$H" | grep -iE -- '--reasoning-parser' -A3 | sed -n '1,4p'
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              # Authoritative argparse acceptance of the tool-capable parser flags (R18/R22/R29 bake these):
              # `serve <flags> --help` exits 0 iff the choices are valid, errors "invalid choice" first if not.
              if docker run --rm --entrypoint vllm "$ref" serve /tmp/none --max-model-len 40960 --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3 --help >/tmp/vh 2>&1; then
                pass "vllm argparse ACCEPTS --enable-auto-tool-choice --tool-call-parser qwen3_xml --reasoning-parser qwen3"
              else
                echo "::error::vllm REJECTS the qwen3_xml/qwen3 parser flags:"; grep -iE 'invalid choice|error|usage' /tmp/vh | head -5; exit 1
              fi
              # EVIDENCE for R03/R06 tools=false: the exact complement of the SGLang check — does vLLM's
              # own argparse REJECT --tool-call-parser minicpm5? exit!=0 + "invalid choice" == not registered.
              if docker run --rm --entrypoint vllm "$ref" serve /tmp/none --max-model-len 1024 --tool-call-parser minicpm5 --help >/tmp/vm 2>&1; then
                echo "- vLLM ACCEPTS --tool-call-parser minicpm5: R03/R06 could be tool-capable, REVISIT (tools not false)" >> "$GITHUB_STEP_SUMMARY"
              else
                if grep -iq 'invalid choice' /tmp/vm; then echo "- EVIDENCE: vLLM argparse REJECTS --tool-call-parser minicpm5 (invalid choice) -> R03/R06 tools=false ESTABLISHED" >> "$GITHUB_STEP_SUMMARY"; else echo "- vLLM minicpm5 probe inconclusive (non-choice error):" >> "$GITHUB_STEP_SUMMARY"; grep -iE 'error|usage' /tmp/vm | head -2 >> "$GITHUB_STEP_SUMMARY"; fi
              fi ;;
            tabby)
              docker run --rm --entrypoint python3 "$ref" -c "import huggingface_hub; print('hf_hub', huggingface_hub.__version__)"
              pass "huggingface_hub import"
              # Execute the ACTUAL TabbyAPI config schema over the baked /app/config.yml (not --help): find the
              # root pydantic model (its fields include 'network') and validate; a bad key/value fails here.
              R=$(docker run --rm --entrypoint python3 -w /app "$ref" -c "import yaml,importlib; m=importlib.import_module('common.config_models'); C=next(c for n in dir(m) for c in [getattr(m,n)] if hasattr(c,'model_fields') and 'network' in getattr(c,'model_fields',{})); cfg=C(**yaml.safe_load(open('/app/config.yml'))); mo=getattr(cfg,'model',cfg); f=lambda k: getattr(mo,k,'?'); print('CONFIG_SCHEMA_OK', C.__name__); print('RESOLVED max_seq_len=%s cache_size=%s chunk_size=%s cache_mode=%s' % (f('max_seq_len'), f('cache_size'), f('chunk_size'), f('cache_mode')))")
              echo "$R"
              echo "$R" | grep -q CONFIG_SCHEMA_OK || { echo "::error::tabby config schema rejected baked config.yml"; exit 1; }
              pass "TabbyAPI config schema validates baked /app/config.yml"
              echo "- tabby engine-resolved values: \`$(echo "$R" | grep RESOLVED)\`" >> "$GITHUB_STEP_SUMMARY" ;;
            llama)
              docker run --rm --entrypoint sh "$ref" -c 'command -v curl && command -v sha256sum && command -v python3 && /opt/llama/llama-server --version 2>&1 | head -1'
              pass "curl + sha256sum + python3 + llama-server present" ;;
            *) echo "::error::unknown engine '$e'"; exit 1;;
          esac
          echo "CPU smoke passed (config-source + parser/flag resolution verified; NOT a runtime inference test)" >> "$GITHUB_STEP_SUMMARY"
