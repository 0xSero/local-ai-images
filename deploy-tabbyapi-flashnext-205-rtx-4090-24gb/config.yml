# R16 ghcr.io/0xsero/deploy-tabbyapi-flashnext-205-rtx-4090-24gb:v1 config.yml
# Derived from the 09-18/09-19 recorded TabbyAPI configs for this EXL3 family; per-row
# max_seq_len/cache_size/chunk_size from DELIVERY-24 pinned_startup. Model fetched by the
# ENTRYPOINT preflight (revision-pinned snapshot_download) into model_dir. Build-status only.
network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true
  disable_fetch_requests: true
  send_tracebacks: false
  api_servers: ["OAI"]
  sse_ping_interval: 15

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: /opt/models
  inline_model_loading: false
  use_dummy_models: false
  model_name: Qwen3.8-Flash-Next-EXL3-205bpw-H4
  backend: exllamav3
  max_seq_len: 131072
  cache_size: 131584
  cache_mode: Q4
  tensor_parallel: false
  gpu_split_auto: true
  autosplit_reserve: [512]
  chunk_size: undefined
  output_chunking: true
  max_batch_size: 2
  vision: true
  reasoning: true
  start_in_reasoning: always
  reasoning_start_token: " thinking"
  reasoning_end_token: "</think>"
  template_vars_default:
    enable_thinking: true
  tool_format: qwen3_coder
  # Flash-Next: 26.24 GB n-gram table in host RAM; routed experts split off-card.
  ngram_ram: true
  cpu_moe_split_experts: 128

draft_model:
  draft_mode: mtp

sampling:
  override_preset:

memory:
  sysmem_recurrent_cache: 4096
  sysmem_kv_cache: 0
  cuda_malloc_async: true
